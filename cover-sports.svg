<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sports" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311024"/>
    </linearGradient>
    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-sports)"/>
  <!-- Field lines -->
  <circle cx="300" cy="180" r="100" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="300" y1="0" x2="300" y2="360" stroke="#334155" stroke-width="2"/>
  <rect x="180" y="80" width="240" height="200" fill="none" stroke="#475569" stroke-width="2" rx="8"/>
  <!-- Motion streaks -->
  <polygon points="50,60 480,20 440,35 70,80" fill="url(#streak)"/>
  <polygon points="120,300 550,220 520,240 100,320" fill="url(#streak)" opacity="0.7"/>
  <!-- Stadium lights effect -->
  <circle cx="520" cy="60" r="80" fill="#FF1E27" opacity="0.15" filter="blur(20px)"/>
  <circle cx="80" cy="300" r="80" fill="#F59E0B" opacity="0.15" filter="blur(20px)"/>
  <!-- Central Badge -->
  <g transform="translate(250, 130)">
    <circle cx="50" cy="50" r="42" fill="#1E293B" stroke="#FF1E27" stroke-width="3"/>
    <!-- Trophy / Speed symbol -->
    <path d="M35 32 H65 V46 C65 54 59 60 50 60 C41 60 35 54 35 46 Z" fill="#F59E0B"/>
    <path d="M28 35 C28 43 35 46 35 46" stroke="#F59E0B" stroke-width="3" fill="none"/>
    <path d="M72 35 C72 43 65 46 65 46" stroke="#F59E0B" stroke-width="3" fill="none"/>
    <rect x="46" y="60" width="8" height="12" fill="#CBD5E1"/>
    <rect x="38" y="72" width="24" height="6" rx="2" fill="#94A3B8"/>
  </g>
  <text x="300" y="325" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#FFFFFF">SPORTS ZONE</text>
  <text x="300" y="345" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#94A3B8">MATCH BREAKDOWNS &amp; ANALYSIS</text>
</svg>
