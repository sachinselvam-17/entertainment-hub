<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cinema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#1A0A26"/>
      <stop offset="100%" stop-color="#2D0612"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-cinema)"/>
  <!-- Film strips top and bottom -->
  <rect x="0" y="0" width="600" height="28" fill="#12081F"/>
  <rect x="0" y="332" width="600" height="28" fill="#12081F"/>
  <!-- Film perfs -->
  <g fill="#371E4D">
    <rect x="15" y="6" width="16" height="16" rx="3"/>
    <rect x="55" y="6" width="16" height="16" rx="3"/>
    <rect x="95" y="6" width="16" height="16" rx="3"/>
    <rect x="135" y="6" width="16" height="16" rx="3"/>
    <rect x="175" y="6" width="16" height="16" rx="3"/>
    <rect x="215" y="6" width="16" height="16" rx="3"/>
    <rect x="255" y="6" width="16" height="16" rx="3"/>
    <rect x="295" y="6" width="16" height="16" rx="3"/>
    <rect x="335" y="6" width="16" height="16" rx="3"/>
    <rect x="375" y="6" width="16" height="16" rx="3"/>
    <rect x="415" y="6" width="16" height="16" rx="3"/>
    <rect x="455" y="6" width="16" height="16" rx="3"/>
    <rect x="495" y="6" width="16" height="16" rx="3"/>
    <rect x="535" y="6" width="16" height="16" rx="3"/>
    <rect x="575" y="6" width="16" height="16" rx="3"/>
    
    <rect x="15" y="338" width="16" height="16" rx="3"/>
    <rect x="55" y="338" width="16" height="16" rx="3"/>
    <rect x="95" y="338" width="16" height="16" rx="3"/>
    <rect x="135" y="338" width="16" height="16" rx="3"/>
    <rect x="175" y="338" width="16" height="16" rx="3"/>
    <rect x="215" y="338" width="16" height="16" rx="3"/>
    <rect x="255" y="338" width="16" height="16" rx="3"/>
    <rect x="295" y="338" width="16" height="16" rx="3"/>
    <rect x="335" y="338" width="16" height="16" rx="3"/>
    <rect x="375" y="338" width="16" height="16" rx="3"/>
    <rect x="415" y="338" width="16" height="16" rx="3"/>
    <rect x="455" y="338" width="16" height="16" rx="3"/>
    <rect x="495" y="338" width="16" height="16" rx="3"/>
    <rect x="535" y="338" width="16" height="16" rx="3"/>
    <rect x="575" y="338" width="16" height="16" rx="3"/>
  </g>
  <!-- Spotlight cone -->
  <polygon points="100,28 500,280 200,320" fill="url(#beam)"/>
  <!-- Clapperboard symbol -->
  <g transform="translate(250, 110)">
    <rect x="0" y="24" width="100" height="70" rx="6" fill="#1C1427" stroke="#FF1E27" stroke-width="2"/>
    <rect x="0" y="0" width="100" height="20" rx="4" fill="#2E1C3F" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="20" y1="0" x2="35" y2="20" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="45" y1="0" x2="60" y2="20" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="70" y1="0" x2="85" y2="20" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Star -->
    <polygon points="50,45 53,53 62,53 55,59 58,68 50,62 42,68 45,59 38,53 47,53" fill="#F59E0B"/>
  </g>
  <text x="300" y="280" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#FFFFFF">CINEMA ZONE</text>
  <text x="300" y="302" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#E2E8F0">REVIEWS, TRAILERS &amp; TAMIL CINEMA</text>
