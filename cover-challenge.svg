<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-challenge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C1842"/>
      <stop offset="100%" stop-color="#3A0828"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg-challenge)"/>
  <!-- Confetti/Geometric elements -->
  <polygon points="120,80 135,70 140,85 125,95" fill="#FF1E27" opacity="0.6"/>
  <polygon points="460,90 475,80 480,95 465,105" fill="#38BDF8" opacity="0.6"/>
  <polygon points="500,240 515,230 520,245 505,255" fill="#F59E0B" opacity="0.6"/>
  <polygon points="90,260 105,250 110,265 95,275" fill="#A855F7" opacity="0.6"/>
  <circle cx="160" cy="200" r="4" fill="#E2E8F0"/>
  <circle cx="440" cy="180" r="5" fill="#E2E8F0"/>
  <!-- Central Gamepad & Lightning -->
  <g transform="translate(240, 95)">
    <!-- Controller Body -->
    <rect x="0" y="20" width="120" height="70" rx="35" fill="#1E293B" stroke="#6366F1" stroke-width="2.5"/>
    <!-- D-pad -->
    <rect x="25" y="45" width="8" height="20" fill="#94A3B8"/>
    <rect x="19" y="51" width="20" height="8" fill="#94A3B8"/>
    <!-- Buttons -->
    <circle cx="90" cy="48" r="4" fill="#FF1E27"/>
    <circle cx="100" cy="58" r="4" fill="#F59E0B"/>
    <circle cx="80" cy="58" r="4" fill="#10B981"/>
    <circle cx="90" cy="68" r="4" fill="#3B82F6"/>
    <!-- Central Lightning bolt -->
    <polygon points="62,-10 48,22 58,22 46,55 74,18 62,18" fill="url(#bolt-grad)"/>
  </g>
  <text x="300" y="280" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="#FFFFFF">FUN &amp; CHALLENGES</text>
  <text x="300" y="302" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="11" letter-spacing="2" fill="#E2E8F0">INTERACTIVE QUIZZES, SPINS &amp; WHO WINS?</text>
</svg>
